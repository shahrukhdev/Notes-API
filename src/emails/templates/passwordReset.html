<!DOCTYPE html>
<html>
  <body style="margin:0; padding:0; background-color:#f9fafb; font-family:Arial, sans-serif;">
    
    <table width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding:40px 0;">
          
          <!-- Card -->
          <table width="100%" cellpadding="0" cellspacing="0" style="max-width:440px; background:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,0.06);">
            
            <!-- Header -->
            <tr>
              <td style="background:linear-gradient(135deg, #10b981, #059669); padding:22px; text-align:center;">
                <h2 style="color:#ffffff; margin:0; font-size:20px; font-weight:600;">
                  Notes Application
                </h2>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding:32px;">
                
                <p style="margin:0 0 16px; color:#111827; font-size:14px;">
                  You requested a password reset.
                </p>

                <p style="margin:0 0 28px; color:#6b7280; font-size:13px; line-height:1.5;">
                  Click the button below to reset your password.
                </p>

                <!-- Button -->
                <div style="text-align:center; margin-bottom:28px;">
                  <a 
                    href="{{resetUrl}}"
                    style="
                      display:inline-block;
                      background:linear-gradient(135deg, #10b981, #059669);
                      color:#ffffff;
                      padding:12px 22px;
                      text-decoration:none;
                      border-radius:8px;
                      font-size:14px;
                      font-weight:600;
                      box-shadow:0 2px 6px rgba(16,185,129,0.3);
                    "
                  >
                    Reset Password
                  </a>
                </div>

                <!-- Divider -->
                <div style="height:1px; background:#f3f4f6; margin:20px 0;"></div>

                <p style="margin:0; color:#9ca3af; font-size:12px; line-height:1.5;">
                  If you did not request this, you can safely ignore this email.
                </p>

              </td>
            </tr>

          </table>

        </td>
      </tr>
    </table>

  </body>
</html>
